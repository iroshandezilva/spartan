<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
body{font:12px/1.5 Inter,system-ui,sans-serif;margin:0;padding:22px;background:var(--figma-color-bg,#fff);color:var(--figma-color-text,#222)}h1{font-size:20px;margin:0 0 7px}p{color:var(--figma-color-text-secondary,#666)}input{width:100%;margin:14px 0}button{font:inherit;padding:9px 14px;border-radius:6px;border:1px solid #bbb;cursor:pointer}button:disabled{opacity:.45;cursor:default}#apply{background:#216547;color:white;border-color:#216547;margin-left:8px}#rows{margin:18px 0;max-height:260px;overflow:auto;border-top:1px solid #ddd}.row{padding:10px 0;border-bottom:1px solid #ddd;display:grid;grid-template-columns:110px 1fr;gap:8px}.row small{grid-column:2;color:var(--figma-color-text-secondary,#666)}#status{white-space:pre-wrap}footer{position:sticky;bottom:0;padding:12px 0;background:var(--figma-color-bg,#fff)}
</style></head><body><h1>Spartant token sync</h1><p>Load a code-owned token file. Review changes before updating this file's variables. Existing bindings are preserved; missing tokens are retained.</p><label for="file">Token JSON file</label><input id="file" type="file" accept=".json,application/json"><p id="status" role="status">Start in a disposable Figma file with the isolated sample tokens.</p><div id="rows"></div><footer><button id="preview" disabled>Preview changes</button><button id="apply" disabled>Apply changes</button></footer><script>
let source;const file=document.getElementById('file'),preview=document.getElementById('preview'),apply=document.getElementById('apply'),status=document.getElementById('status'),rows=document.getElementById('rows');
file.onchange=async()=>{source=undefined;apply.disabled=true;preview.disabled=true;rows.replaceChildren();try{if(!file.files[0])return;if(file.files[0].size>2000000)throw Error('Choose a JSON file smaller than 2 MB.');source=JSON.parse(await file.files[0].text());preview.disabled=false;status.textContent='File loaded. Preview changes before applying.';}catch(e){status.textContent=e.message;}};
preview.onclick=()=>{preview.disabled=true;apply.disabled=true;file.disabled=true;status.textContent='Checking tokens and existing variables…';parent.postMessage({pluginMessage:{type:'preview',source}},'*');};
apply.onclick=()=>{apply.disabled=true;preview.disabled=true;file.disabled=true;status.textContent='Applying token changes…';parent.postMessage({pluginMessage:{type:'apply'}},'*');};
window.onmessage=event=>{const m=event.data.pluginMessage;if(!m)return;file.disabled=false;preview.disabled=!source;if(m.type==='plan'){rows.replaceChildren();for(const r of m.rows){const row=document.createElement('div');row.className='row';const action=document.createElement('strong'),key=document.createElement('span'),detail=document.createElement('small');action.textContent=r.action;key.textContent=r.key;detail.textContent=r.detail;row.append(action,key,detail);rows.append(row);}status.textContent='Target: '+m.file+'\nToken version: '+m.version;apply.disabled=false;}else{apply.disabled=true;status.textContent=m.message;}};
</script></body></html>
